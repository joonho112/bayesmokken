articles:
- title: Applied track
  navbar: ~
  desc: >
    Workflow first. Install, run, read the result, report it, draw it. Formulas
    are kept to a minimum and derivations are left to the methodological track.
  contents:
  - a1-getting-started
  - a2-binary-srs-workflow
  - a3-clustered-polytomous-workflow
  - a4-reporting-and-exporting
  - a5-visualization-cookbook

- title: Methodological track
  navbar: ~
  desc: >
    The mathematics behind the functions. Every displayed equation is followed
    by a chunk that recomputes it from the returned object, so the definitions
    are checked rather than asserted.
  contents:
  - m1-foundations
  - m2-bayesian-bootstrap-calibration
  - m3-polytomous-transport
  - m4-hierarchical-bb-targets
  - m5-reproducibility-and-evidence

reference:
- title: Estimation
  desc: >
    The two entry points. `mokken_h()` computes the coefficient;
    `bb_mokken_h()` adds the interval. Both take the same declarations.
  contents:
  - mokken_h
  - bb_mokken_h
  - bayes_mokken_h

- title: Preparing data
  desc: >
    Screen a dataset before fitting and build the arguments the entry points
    require. Reverse keying is reported here, and applied only when you ask.
  contents:
  - bm_check_data
  - bm_supports
  - bm_score_map
  - bm_missing_codes
  - bm_cluster_info

- title: Extracting results
  desc: >
    Plain data frames whose columns are fixed by an installed schema and
    checked against it by the tests. Use these rather than reaching into the
    fitted object.
  contents:
  - bm_scale_h
  - bm_item_h
  - bm_pair_h
  - bm_interval
  - bm_draws
  - bm_provenance
  - tidy.bm_bb_h
  - as.data.frame.bm_bb_h

- title: Diagnostics
  desc: >
    What would tell you a result is unreliable: vanishing denominators,
    transport knots, and simulation noise in the endpoints.
  contents:
  - bm_diagnostics
  - bm_mc_diagnostics
  - bm_knot_diagnostics
  - bm_regularity

- title: Reporting
  desc: >
    Manuscript tables, the conventional descriptive landmarks, comparison
    across fits, the refusal list, and the citation to use.
  contents:
  - bm_report
  - bm_benchmark
  - bm_compare
  - bm_guardrails
  - bm_cite

- title: Visualization
  desc: >
    Eight figures, a house theme and colour scales. Every distinction is
    carried by at least two channels, so nothing is lost in greyscale or to
    colour-vision deficiency.
  contents:
  - bm_plot_scale_h
  - bm_plot_item_h
  - bm_plot_pair_h
  - bm_plot_draws
  - bm_plot_mc_stability
  - bm_plot_calibration
  - bm_plot_margins
  - bm_plot_clusters
  - bm_plot_overview
  - autoplot.bm_bb_h
  - theme_bayesmokken
  - scale_colour_bayesmokken
  - bm_palette
  - bm_alt_text

- title: Datasets
  desc: >
    One real binary scale, one synthetic clustered polytomous dataset, and a
    teaching generator.
  contents:
  - srs
  - classroom_wb
  - bm_simulate

- title: Console output
  desc: >
    Print and summary methods, and optional cli-decorated formatters. Default
    printing uses base R only.
  contents:
  - print.bm_bb_h
  - print.bm_empirical_h
  - print.bm_h_interval
  - print.bm_data_check
  - print.bm_cluster_info
  - print.bm_diagnostic_report
  - print.bm_benchmark
  - print.bm_report
  - summary.bm_bb_h
  - summary.bm_empirical_h
  - format_bm_fit_cli
  - format_bm_interval_cli
  - format_bm_items_cli

- title: Concepts
  desc: >
    Background pages that several functions share: what is being estimated,
    what the intervals do and do not claim, how the figures are built, and the
    vocabulary used throughout.
  contents:
  - bayesmokken-package
  - bayesmokken-estimands
  - bayesmokken-intervals
  - bayesmokken-plots
  - bayesmokken-glossary
  - reexports

