url: https://joonho112.github.io/bayesmokken/

# No `light-switch: true`, deliberately. pkgdown renders dark mode by applying
# `filter: invert(1) hue-rotate(180deg)` to every figure. The package's figures
# are verified on white: the accessibility gate measures caption contrast at
# 5.74:1 and checks that the sequential palette runs L* 92.0 down to 34.9.
# Inversion reverses that lightness ordering and voids the contrast measurement,
# and nothing checks the inverted result. Shipping a dark mode whose
# accessibility properties are unverified would be worse than shipping none.
template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#1F6F70"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "Source Code Pro"}

home:
  title: "Calibrated Bayesian-Bootstrap Intervals for Mokken Scalability"
  description: >
    Mokken scale analysis reports the scalability coefficient H as a bare point
    estimate. This package supplies confidence intervals for H whose coverage
    was checked in large prespecified simulations rather than assumed, for
    binary scales and for polytomous scales whose respondents are nested in
    clusters.

